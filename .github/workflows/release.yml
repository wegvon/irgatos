name: Release

# Publishes the GitHub Release that Irgatos' "Check for Updates" reads:
#   Irgatos_<version>_aarch64.app.tar.gz / _x64.app.tar.gz   (in-app install)
#   Irgatos_<version>_aarch64.dmg / _x64.dmg                 (manual install)
#   latest.json + .sig files                                 (only with updater keys)
# The release notes end with "Commit: <sha>" so the app can compare commits.
#
# No secret is required. When present they are used:
#   APPLE_SIGNING_IDENTITY, APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD
#       Developer ID signing (otherwise ad-hoc "-", which the in-app updater
#       accepts after stripping quarantine)
#   APPLE_API_KEY, APPLE_API_ISSUER, APPLE_API_KEY_P8
#       notarization
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD, TAURI_UPDATER_PUBKEY
#       Tauri updater signatures and latest.json for the native updater
#   R2_*  mirror latest.json to R2 (required for beta updater feeds)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (defaults to v<package.json version>; created on this commit if missing)
        required: false
      all_platforms:
        description: Also build Linux, Windows and standalone host packages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.RELEASE_PRERELEASE }}
      feed_key: ${{ steps.meta.outputs.UPDATER_FEED_KEY }}
      all_platforms: ${{ steps.meta.outputs.all_platforms }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_ALL_PLATFORMS: ${{ inputs.all_platforms }}
          ALL_PLATFORMS_VAR: ${{ vars.RELEASE_ALL_PLATFORMS }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="${INPUT_TAG:-v$VERSION}"
          fi
          # Fails unless package.json, Cargo.toml and tauri.conf.json all carry
          # the tag's version and CHANGELOG.md has a section for it.
          node scripts/bump-version.mjs --check "${TAG#v}"
          RELEASE_TAG="$TAG" GITHUB_ENV="$GITHUB_OUTPUT" node scripts/release-channel.cjs
          ALL=false
          if [[ "$INPUT_ALL_PLATFORMS" == true || "$ALL_PLATFORMS_VAR" == true ]]; then ALL=true; fi
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "all_platforms=$ALL"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG from $GITHUB_SHA (all platforms: $ALL)"

  macos:
    name: macOS ${{ matrix.arch }}
    needs: prepare
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
            lipo: arm64
          - target: x86_64-apple-darwin
            arch: x64
            lipo: x86_64
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      IRGATOS_BUILD_COMMIT: ${{ github.sha }}
      IRGATOS_BUILD_BRANCH: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: npm ci

      # Only non-empty secrets are exported: Tauri treats a set-but-empty
      # APPLE_API_KEY or TAURI_SIGNING_PRIVATE_KEY as a request to use it.
      - name: Configure signing
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_UPDATER_ENDPOINT: ${{ secrets.TAURI_UPDATER_ENDPOINT }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          export_env() {
            local name="$1"
            [[ -n "${!name:-}" ]] || return 0
            { echo "$name<<__IRGATOS_EOF__"; printf '%s\n' "${!name}"; echo "__IRGATOS_EOF__"; } >> "$GITHUB_ENV"
          }
          if [[ -n "${APPLE_CERTIFICATE:-}" ]]; then
            export_env APPLE_CERTIFICATE
            export_env APPLE_CERTIFICATE_PASSWORD
          fi
          if [[ -n "${APPLE_API_KEY:-}" && -n "${APPLE_API_ISSUER:-}" && -n "${APPLE_API_KEY_P8:-}" ]]; then
            mkdir -p "$HOME/private_keys"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$HOME/private_keys/AuthKey_${APPLE_API_KEY}.p8"
            echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"
            export_env APPLE_API_KEY
            export_env APPLE_API_ISSUER
            echo "Notarization: on"
          else
            echo "Notarization: off (APPLE_API_KEY, APPLE_API_ISSUER and APPLE_API_KEY_P8 not all set)"
          fi
          if [[ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" && -n "${TAURI_UPDATER_PUBKEY:-}" ]]; then
            export_env TAURI_SIGNING_PRIVATE_KEY
            export_env TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            UPDATER=true
          else
            UPDATER=false
          fi
          UPDATER="$UPDATER" node <<'NODE'
          const { writeFileSync } = require("node:fs");
          const identity = (process.env.APPLE_SIGNING_IDENTITY || "").trim() || "-";
          const config = { bundle: { macOS: { signingIdentity: identity } } };
          let updater = process.env.UPDATER === "true";
          if (updater) {
            try {
              const { updaterEndpoint } = require("./scripts/release-channel.cjs");
              config.plugins = {
                updater: {
                  pubkey: process.env.TAURI_UPDATER_PUBKEY,
                  endpoints: [updaterEndpoint(process.env)],
                },
              };
            } catch (error) {
              console.log(`Native updater feed: off (${error.message})`);
              updater = false;
            }
          }
          config.bundle.createUpdaterArtifacts = updater;
          console.log(`Code signing: ${identity === "-" ? "ad-hoc" : "Developer ID"}`);
          console.log(`Tauri updater artifacts: ${updater ? "on" : "off"}`);
          writeFileSync(`${process.env.RUNNER_TEMP}/tauri.release.conf.json`, JSON.stringify(config, null, 2));
          NODE

      - name: Build
        run: npx tauri build --target ${{ matrix.target }} --bundles app,dmg --config "$RUNNER_TEMP/tauri.release.conf.json"

      - name: Verify architecture and signature
        run: |
          set -euo pipefail
          APP="target/${{ matrix.target }}/release/bundle/macos/Irgatos.app"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          ACTUAL=$(lipo -archs "$APP/Contents/MacOS/$EXECUTABLE")
          if [[ "$ACTUAL" != "${{ matrix.lipo }}" ]]; then
            echo "Expected $APP to contain only ${{ matrix.lipo }}, got: $ACTUAL" >&2
            exit 1
          fi
          BUNDLE_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          if [[ "$BUNDLE_VERSION" != "$VERSION" ]]; then
            echo "Expected bundle version $VERSION, got $BUNDLE_VERSION" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Stage assets
        run: |
          set -euo pipefail
          BUNDLE="target/${{ matrix.target }}/release/bundle"
          ARCHIVE="release-artifacts/Irgatos_${VERSION}_${{ matrix.arch }}.app.tar.gz"
          mkdir -p release-artifacts
          if [[ -f "$BUNDLE/macos/Irgatos.app.tar.gz" ]]; then
            cp "$BUNDLE/macos/Irgatos.app.tar.gz" "$ARCHIVE"
            cp "$BUNDLE/macos/Irgatos.app.tar.gz.sig" "$ARCHIVE.sig"
          else
            COPYFILE_DISABLE=1 tar -C "$BUNDLE/macos" -czf "$ARCHIVE" Irgatos.app
          fi
          shopt -s nullglob
          DMGS=("$BUNDLE"/dmg/*.dmg)
          if (( ${#DMGS[@]} != 1 )); then
            echo "Expected exactly one DMG, found ${#DMGS[@]}" >&2
            exit 1
          fi
          cp "${DMGS[0]}" "release-artifacts/Irgatos_${VERSION}_${{ matrix.arch }}.dmg"
          ls -l release-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: release-artifacts/
          if-no-files-found: error

  host:
    name: Standalone host packages
    needs: prepare
    if: needs.prepare.outputs.all_platforms == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:host
      - run: npm run host:package -- --all
        if: runner.os == 'Linux'
      - run: npm run host:package
        if: runner.os != 'Linux'
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: host-packages
          path: |
            build/host-packages/*.tar.gz
            build/host-packages/*.zip
            build/host-packages/*.sha256
          if-no-files-found: error

  linux:
    name: Linux packages
    needs: prepare
    if: needs.prepare.outputs.all_platforms == 'true'
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      IRGATOS_BUILD_COMMIT: ${{ github.sha }}
      IRGATOS_BUILD_BRANCH: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: bash scripts/install-linux-deps-debian.sh

      - run: npm ci

      - name: Write updater release config
        env:
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_UPDATER_ENDPOINT: ${{ secrets.TAURI_UPDATER_ENDPOINT }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          node <<'NODE'
          const { writeFileSync } = require("node:fs");
          const config = { bundle: { createUpdaterArtifacts: false } };
          const pubkey = process.env.TAURI_UPDATER_PUBKEY || "";
          if (pubkey && process.env.HAS_SIGNING_KEY === "true") {
            try {
              const { updaterEndpoint } = require("./scripts/release-channel.cjs");
              config.plugins = { updater: { pubkey, endpoints: [updaterEndpoint(process.env)] } };
            } catch (error) {
              console.log(`Native updater feed: off (${error.message})`);
            }
          }
          writeFileSync(`${process.env.RUNNER_TEMP}/tauri.release.conf.json`, JSON.stringify(config, null, 2));
          NODE

      # Same as `npm run build:linux`, with the updater config merged in.
      # npm would append extra args to the repack script, not tauri build.
      - name: Build Linux packages
        run: |
          set -euo pipefail
          npx tauri build --bundles deb,appimage --config "$RUNNER_TEMP/tauri.release.conf.json"
          bash scripts/repack-appimage.sh

      - name: Assert AppImage uses host libraries
        run: bash scripts/assert-appimage-host-libs.sh

      # Sign after repack-appimage.sh: a signature Tauri wrote during the
      # build would cover the pre-repack file and fail updater verification.
      - name: Sign AppImage for the updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY not set; publishing an unsigned AppImage"
            exit 0
          fi
          shopt -s nullglob
          appimage=(target/release/bundle/appimage/*.AppImage)
          if (( ${#appimage[@]} != 1 )); then
            echo "Expected exactly one AppImage" >&2
            exit 1
          fi
          npx tauri signer sign "${appimage[0]}"
          test -s "${appimage[0]}.sig"

      - name: Stage Linux packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          deb=(target/release/bundle/deb/*.deb)
          appimage=(target/release/bundle/appimage/*.AppImage)
          if (( ${#deb[@]} != 1 || ${#appimage[@]} != 1 )); then
            echo "Expected exactly one .deb and one AppImage" >&2
            exit 1
          fi
          mkdir -p release-artifacts
          cp "${deb[0]}" "${appimage[0]}" release-artifacts/
          if [[ -s "${appimage[0]}.sig" ]]; then cp "${appimage[0]}.sig" release-artifacts/; fi

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: release-artifacts/
          if-no-files-found: error

  linux-rpm:
    name: Linux rpm package
    needs: prepare
    if: needs.prepare.outputs.all_platforms == 'true'
    runs-on: ubuntu-latest
    # Build on EL 10 so the published rpm's glibc requirement matches the
    # oldest advertised target. Fedora 43 is newer and would install on EL 10
    # while failing to load.
    container: almalinux:10
    steps:
      # almalinux:10 ships no git, which actions/checkout otherwise has to work
      # around with a REST API tarball download.
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Enterprise Linux system dependencies
        run: bash scripts/install-linux-deps-fedora.sh

      - run: npm ci

      - name: Build rpm package
        run: npx tauri build --bundles rpm --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Install and stage the generated rpm
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle=(target/release/bundle/rpm/*.rpm)
          if (( ${#bundle[@]} != 1 )); then
            echo "Expected exactly one .rpm" >&2
            exit 1
          fi
          # tauri-bundler derives rpm Requires only from
          # bundle.linux.rpm.depends, and the setup script has already
          # installed every -devel package, so assert the metadata directly.
          requires="$(rpm -qp --requires "${bundle[0]}")"
          for dep in webkit2gtk4.1 gtk3 libappindicator-gtk3 librsvg2 openssl-libs; do
            if ! grep -qx "$dep" <<<"$requires"; then
              echo "rpm is missing Requires: $dep" >&2
              exit 1
            fi
          done
          dnf install -y "${bundle[0]}"
          rpm -q "$(rpm -qp --queryformat '%{NAME}' "${bundle[0]}")"
          mkdir -p release-artifacts
          cp "${bundle[0]}" release-artifacts/

      - name: Upload rpm package
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm-package
          path: release-artifacts/
          if-no-files-found: error

  windows:
    name: Windows packages
    needs: prepare
    if: needs.prepare.outputs.all_platforms == 'true'
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      IRGATOS_BUILD_COMMIT: ${{ github.sha }}
      IRGATOS_BUILD_BRANCH: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Write updater release config
        env:
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_UPDATER_ENDPOINT: ${{ secrets.TAURI_UPDATER_ENDPOINT }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        shell: bash
        run: |
          node <<'NODE'
          const { writeFileSync } = require("node:fs");
          const config = { bundle: { createUpdaterArtifacts: false } };
          const pubkey = process.env.TAURI_UPDATER_PUBKEY || "";
          if (pubkey && process.env.HAS_SIGNING_KEY === "true") {
            try {
              const { updaterEndpoint } = require("./scripts/release-channel.cjs");
              config.plugins = { updater: { pubkey, endpoints: [updaterEndpoint(process.env)] } };
              config.bundle.createUpdaterArtifacts = true;
            } catch (error) {
              console.log(`Native updater feed: off (${error.message})`);
            }
          }
          writeFileSync(`${process.env.RUNNER_TEMP}/tauri.release.conf.json`, JSON.stringify(config, null, 2));
          NODE

      - name: Build Windows packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $env:RUSTUP_TOOLCHAIN = "stable-x86_64-pc-windows-msvc"
          npx tauri build --bundles nsis --config "$env:RUNNER_TEMP\tauri.release.conf.json"

      - name: Stage Windows packages
        run: |
          $installers = @(Get-ChildItem "target/release/bundle/nsis" -Filter "*.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer"
          }
          New-Item -ItemType Directory -Force "release-artifacts" | Out-Null
          $artifacts = @($installers[0].FullName) + @(Get-ChildItem "target/release/bundle/nsis" -Filter "*.exe.sig" | ForEach-Object { $_.FullName })
          Copy-Item -Path $artifacts -Destination "release-artifacts/"

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: release-artifacts/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [prepare, macos, host, linux, linux-rpm, windows]
    # Optional platforms may be skipped; none of the jobs that ran may fail.
    if: >-
      always() && needs.prepare.result == 'success' && needs.macos.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      UPDATER_FEED_KEY: ${{ needs.prepare.outputs.feed_key }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write release notes and updater feed
        run: |
          set -euo pipefail
          ls -l dist
          node <<'NODE'
          const fs = require("node:fs");
          const { VERSION, TAG, GITHUB_SHA, GITHUB_REPOSITORY } = process.env;
          const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
          const escaped = VERSION.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const start = new RegExp(`^## \\[${escaped}\\][^\\n]*\\n`, "m").exec(changelog);
          let body = "";
          if (start) {
            const rest = changelog.slice(start.index + start[0].length);
            const next = /^## |^\[[^\]]+\]: /m.exec(rest);
            body = rest.slice(0, next ? next.index : undefined).trim();
          }
          // The app reads this line to compare the release against its build.
          fs.writeFileSync("release-notes.md", `${body || `Irgatos ${VERSION}`}\n\nCommit: ${GITHUB_SHA}\n`);

          const files = fs.readdirSync("dist");
          const url = (name) => `https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${name}`;
          const platforms = {};
          const add = (key, pattern) => {
            const asset = files.find((name) => pattern.test(name) && files.includes(`${name}.sig`));
            if (!asset) return;
            platforms[key] = {
              signature: fs.readFileSync(`dist/${asset}.sig`, "utf8").trim(),
              url: url(asset),
            };
          };
          add("darwin-aarch64", /_aarch64\.app\.tar\.gz$/);
          add("darwin-x86_64", /_x64\.app\.tar\.gz$/);
          add("windows-x86_64", /-setup\.exe$/);
          // AppImage only: the installer-specific key keeps .deb and .rpm
          // installs on their package manager instead of self-updating.
          add("linux-x86_64-appimage", /\.AppImage$/);
          if (Object.keys(platforms).length) {
            const feed = { version: VERSION, notes: body || `Irgatos ${VERSION}`, pub_date: new Date().toISOString(), platforms };
            fs.writeFileSync("dist/latest.json", `${JSON.stringify(feed, null, 2)}\n`);
            console.log(`latest.json covers ${Object.keys(platforms).join(", ")}`);
          } else {
            console.log("No updater signatures; skipping latest.json (the in-app GitHub updater does not need it)");
          }
          NODE
          (cd dist && sha256sum -- * > SHA256SUMS.txt)

      - name: Create or update the release
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft)
            if [[ "$IS_DRAFT" != true ]]; then
              # A published release is what installed apps already compared
              # against; replacing its assets would change an existing version.
              echo "Release $TAG is already published. Bump the version instead." >&2
              exit 1
            fi
          else
            gh release create "$TAG" \
              --draft \
              --target "$GITHUB_SHA" \
              --prerelease="$RELEASE_PRERELEASE" \
              --title "Irgatos $VERSION" \
              --notes-file release-notes.md
          fi
          gh release edit "$TAG" --notes-file release-notes.md
          gh release upload "$TAG" dist/* --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > uploaded.txt
          (cd dist && ls -1) | sort > expected.txt
          if ! diff -u expected.txt uploaded.txt; then
            echo "GitHub Release is missing assets" >&2
            exit 1
          fi
          gh release edit "$TAG" --draft=false --prerelease="$RELEASE_PRERELEASE"
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

      - name: Mirror updater feed to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          if [[ ! -f dist/latest.json || -z "${R2_BUCKET_NAME:-}" || -z "${R2_ACCOUNT_ID:-}" ]]; then
            echo "Skipping R2 mirror"
            exit 0
          fi
          aws s3 cp dist/latest.json "s3://${R2_BUCKET_NAME}/${UPDATER_FEED_KEY}" \
            --content-type "application/json" \
            --cache-control "no-store,max-age=0,must-revalidate" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
