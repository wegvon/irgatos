<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/irgat.png" />
    <title>Irgatos</title>
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var read = function (name) {
            return localStorage.getItem("irgat." + name);
          };
          var hue = read("themeHue");
          var sat = read("themeSaturation");
          var darkLightness = read("themeDarkLightness");
          var opacity = read("sidebarOpacity");
          if (hue != null) {
            var h = Math.max(0, Math.min(360, Number(hue) || 0));
            root.style.setProperty("--theme-hue", String(h));
          }
          if (sat != null) {
            var s = Math.max(0, Math.min(100, Number(sat) || 0));
            root.style.setProperty("--theme-saturation", s + "%");
            if (s > 0) root.classList.add("has-theme-tint");
          }
          if (darkLightness != null) {
            var l = Math.max(0, Math.min(30, Number(darkLightness) || 0));
            root.style.setProperty("--theme-dark-lightness", l + "%");
          }
          if (opacity != null) {
            var o = Math.max(0.15, Math.min(1, Number(opacity) || 0.85));
            root.style.setProperty("--sidebar-opacity", String(o));
          }
          var palette = read("palette");
          if (
            ["sage", "sea", "lavender", "rose", "claude"].indexOf(palette) >= 0
          ) {
            root.classList.add("palette-" + palette);
          }
          var scheme = read("colorScheme");
          if (scheme === "system") {
            scheme = window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          }
          if (scheme === "light") {
            root.classList.add("theme-light");
          }
          var bodyGlass = read("bodyGlass");
          if (bodyGlass == null || bodyGlass === "1" || bodyGlass === "true") {
            root.classList.add("glass-body");
          }
          var isMac =
            typeof navigator !== "undefined" &&
            /Mac|iPhone|iPad/.test(navigator.platform);
          if (isMac) {
            root.classList.add("is-mac");
          }
        } catch (_) {}
      })();
    </script>
    <style>
      :root {
        --theme-hue: 240;
        --theme-saturation: 0%;
        --theme-dark-lightness: 9%;
        --sidebar-opacity: 0.85;
        --background-lightness: var(--theme-dark-lightness);
        --surface-hue: var(--theme-hue);
        --surface-saturation: var(--theme-saturation);
        --color-background-base: hsl(
          var(--surface-hue) var(--surface-saturation) var(--background-lightness)
        );
      }

      html.theme-light {
        --background-lightness: 95%;
      }

      html.theme-light:not(.has-theme-tint) {
        --surface-hue: 40;
        --surface-saturation: 26%;
      }

      /* Palette surfaces from index.css, so the splash matches. */
      html.palette-sage:not(.theme-light):not(.has-theme-tint) {
        --surface-hue: 110;
        --surface-saturation: 9%;
      }

      html.theme-light.palette-sage:not(.has-theme-tint) {
        --surface-hue: 105;
        --surface-saturation: 18%;
      }

      html.palette-sea:not(.theme-light):not(.has-theme-tint) {
        --surface-hue: 195;
        --surface-saturation: 15%;
      }

      html.theme-light.palette-sea:not(.has-theme-tint) {
        --surface-hue: 192;
        --surface-saturation: 24%;
      }

      html.palette-lavender:not(.theme-light):not(.has-theme-tint) {
        --surface-hue: 260;
        --surface-saturation: 14%;
      }

      html.theme-light.palette-lavender:not(.has-theme-tint) {
        --surface-hue: 262;
        --surface-saturation: 24%;
      }

      html.palette-rose:not(.theme-light):not(.has-theme-tint) {
        --surface-hue: 344;
        --surface-saturation: 11%;
      }

      html.theme-light.palette-rose:not(.has-theme-tint) {
        --surface-hue: 346;
        --surface-saturation: 26%;
      }

      html.palette-claude:not(.theme-light):not(.has-theme-tint) {
        --surface-hue: 60;
        --surface-saturation: 3%;
        --background-lightness: 14.5%;
      }

      html.theme-light.palette-claude:not(.has-theme-tint) {
        --surface-hue: 60;
        --surface-saturation: 20%;
        --background-lightness: 98.6%;
      }

      html,
      body,
      #boot-splash {
        margin: 0;
        background: var(--color-background-base);
      }

      /* Opaque cover until React paints. The logo is in HTML so it is
         visible during the Dock bounce, before the bundle runs. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        transition: opacity 0.16s ease;
      }

      #boot-splash.boot-splash-out {
        opacity: 0;
      }

      #boot-splash img {
        width: 72px;
        height: 72px;
        object-fit: contain;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <img src="/irgat.png" alt="" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
